name: Weekly Developer Announcement

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  copilot-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Weekly Announcement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-announcement.js

      - name: Test Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot -p "In one sentence, explain what this repository is about." -s --no-ask-user
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}