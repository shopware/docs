name: Check docs milestone and shopware version

# Docs PRs carry a milestone such as "v6.7.x.x": the shopware/shopware release
# the documented feature ships in. While that release is not published the PR
# gets the "Blocked" label. Once it is published, the label is removed and a
# "ready to be merged" comment is posted, once.
#
# The logic lives in .github/scripts/milestone-release-sync.js.
# Run it by hand first with "dry_run" enabled: it only lists what it would do.

on:
  schedule:
    # Hourly, not daily. Releases land at varying times and every step is
    # idempotent, so extra runs change nothing.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only log what would change, write nothing'
        type: boolean
        default: true

# Two overlapping runs could both see "no comment yet" and comment twice.
concurrency:
  group: version-milestone-check
  cancel-in-progress: false

permissions: {}

jobs:
  sync-milestones:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run unit tests
        run: node --test .github/scripts/milestone-release-sync.test.js

      - name: Sync milestones with Shopware releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node .github/scripts/milestone-release-sync.js
